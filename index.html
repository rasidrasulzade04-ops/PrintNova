<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printnova Internal Calculator</title>
    <style>
        :root {
            --primary: #ff4757;
            --bg: #f1f2f6;
            --card: #ffffff;
            --text: #2f3542;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .calculator-card {
            background: var(--card);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 22px;
        }
        .slot-title {
            font-size: 14px;
            font-weight: bold;
            color: #57606f;
            margin-top: 15px;
            margin-bottom: 5px;
            text-transform: uppercase;
            border-bottom: 1px solid #dfe4ea;
            padding-bottom: 3px;
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .form-group-filament {
            flex: 2;
        }
        .form-group-weight {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 12px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ced6e0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .margin-group {
            margin-top: 15px;
            margin-bottom: 15px;
        }
        hr {
            border: none;
            border-top: 2px dashed #ced6e0;
            margin: 20px 0;
        }
        .result-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .result-box {
            padding: 15px;
            border-radius: 8px;
        }
        .cost-box {
            background-color: #dfe4ea;
            border-left: 5px solid #747d8c;
        }
        .price-box {
            background-color: #ffeaa7;
            border-left: 5px solid #e67e22;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .result-title {
            font-size: 14px;
            text-transform: uppercase;
        }
        .result-value {
            font-size: 22px;
            font-weight: 800;
        }
        .breakdown {
            font-size: 12px;
            color: #57606f;
            border-top: 1px dotted #a4b0be;
            padding-top: 5px;
            margin-top: 5px;
        }
        .breakdown-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Printnova Multi-Color</h2>
    
    <div class="slot-title">Слот 1 (Обязательный)</div>
    <div class="form-row">
        <div class="form-group-filament">
            <select id="filament1" onchange="calculatePrices()"></select>
        </div>
        <div class="form-group-weight">
            <input type="number" id="weight1" placeholder="Вес (г)" min="0" oninput="calculatePrices()">
        </div>
    </div>

    <div class="slot-title">Слот 2</div>
    <div class="form-row">
        <div class="form-group-filament">
            <select id="filament2" onchange="calculatePrices()"></select>
        </div>
        <div class="form-group-weight">
            <input type="number" id="weight2" placeholder="Вес (г)" min="0" oninput="calculatePrices()">
        </div>
    </div>

    <div class="slot-title">Слот 3</div>
    <div class="form-row">
        <div class="form-group-filament">
            <select id="filament3" onchange="calculatePrices()"></select>
        </div>
        <div class="form-group-weight">
            <input type="number" id="weight3" placeholder="Вес (г)" min="0" oninput="calculatePrices()">
        </div>
    </div>

    <div class="slot-title">Слот 4</div>
    <div class="form-row">
        <div class="form-group-filament">
            <select id="filament4" onchange="calculatePrices()"></select>
        </div>
        <div class="form-group-weight">
            <input type="number" id="weight4" placeholder="Вес (г)" min="0" oninput="calculatePrices()">
        </div>
    </div>

    <div class="margin-group">
        <label for="marginSelect">Наценка для продажи (Margin):</label>
        <select id="marginSelect" onchange="calculatePrices()">
            <option value="2">x2 (Обычная цена)</option>
            <option value="2.5">x2.5 (Рекомендуемая ярмарка)</option>
            <option value="3">x3 (Эксклюзив / Сложная печать)</option>
        </select>
    </div>

    <hr>

    <div class="result-section">
        <div class="result-box cost-box">
            <div class="result-header">
                <div class="result-title">Общая Себестоимость</div>
                <div class="result-value" id="totalCostDisplay">0.00 ₼</div>
            </div>
            <div class="breakdown" id="costBreakdown">
                </div>
        </div>

        <div class="result-box price-box">
            <div class="result-header">
                <div class="result-title">Итоговая Цена продажи</div>
                <div class="result-value" id="totalPriceDisplay">0.00 ₼</div>
            </div>
            <div class="breakdown" id="priceBreakdown">
                </div>
        </div>
    </div>
</div>

<script>
// ==========================================
// НАША БАЗА ДАННЫХ ПЛАСТИКА
// ==========================================
const filamentDatabase = {
    "Anycubic PLA Silk Tri-Color (Blue-Purple-Green)": 39.09,
    "Anycubic PLA Black": 30.59
};

// Функция заполнения всех 4-х селекторов
function loadFilaments() {
    for (let i = 1; i <= 4; i++) {
        const select = document.getElementById(`filament${i}`);
        select.innerHTML = "";
        
        // Для слотов 2, 3 и 4 добавляем вариант "None" на первое место
        if (i > 1) {
            let noneOption = document.createElement("option");
            noneOption.value = "none";
            noneOption.textContent = "— Нет (None) —";
            select.appendChild(noneOption);
        }
        
        for (const color in filamentDatabase) {
            let option = document.createElement("option");
            option.value = color;
            option.textContent = `${color} (${filamentDatabase[color]} ₼/кг)`;
            select.appendChild(option);
        }
    }
    calculatePrices();
}

// Функция подсчета
function calculatePrices() {
    let totalCost = 0;
    let totalSellingPrice = 0;
    
    let costBreakdownHtml = "";
    let priceBreakdownHtml = "";
    
    const multiplier = parseFloat(document.getElementById("marginSelect").value);
    let hasData = false;

    // Считаем каждый из 4 слотов
    for (let i = 1; i <= 4; i++) {
        const selectedColor = document.getElementById(`filament${i}`).value;
        const weight = parseFloat(document.getElementById(`weight2` ? document.getElementById(`weight${i}`).value : 0)) || 0;
        
        // Если выбран пластик (не none) и введен вес больше 0
        if (selectedColor !== "none" && weight > 0) {
            hasData = true;
            const pricePerKg = filamentDatabase[selectedColor] || 0;
            
            // Расчет себестоимости для одного цвета
            let pricePerGram = pricePerKg / 1000;
            let plasticCost = weight * pricePerGram;
            let amortization = weight * 0.01; 
            let extraCosts = plasticCost * 0.10; 
            let slotCost = plasticCost + amortization + extraCosts;
            
            // Расчет цены продажи для одного цвета с автоматическим округлением вверх
            let slotSellingPrice = Math.ceil(slotCost * multiplier);
            
            // Копим общие суммы
            totalCost += slotCost;
            totalSellingPrice += slotSellingPrice;
            
            // Короткое имя пластика для вывода в чек
            let shortName = selectedColor.includes("Tri-Color") ? "PLA Silk Tri-Color" : "PLA Black";
            
            // Добавляем строчку в детализацию
            costBreakdownHtml += `<div class="breakdown-item"><span>Слот ${i} (${shortName}): ${weight}г</span><span>${slotCost.toFixed(2)} ₼</span></div>`;
            priceBreakdownHtml += `<div class="breakdown-item"><span>Слот ${i} (${shortName}) x${multiplier}:</span><span>${slotSellingPrice}.00 ₼</span></div>`;
        }
    }

    // Выводим данные на экран
    if (!hasData) {
        document.getElementById("totalCostDisplay").textContent = "0.00 ₼";
        document.getElementById("totalPriceDisplay").textContent = "0.00 ₼";
        document.getElementById("costBreakdown").innerHTML = '<div style="text-align:center;color:#747d8c;">Введите вес для расчета</div>';
        document.getElementById("priceBreakdown").innerHTML = '<div style="text-align:center;color:#747d8c;">Введите вес для расчета</div>';
        return;
    }

    document.getElementById("totalCostDisplay").textContent = totalCost.toFixed(2) + " ₼";
    document.getElementById("totalPriceDisplay").textContent = totalSellingPrice.toFixed(2) + " ₼";
    
    document.getElementById("costBreakdown").innerHTML = costBreakdownHtml;
    document.getElementById("priceBreakdown").innerHTML = priceBreakdownHtml;
}

window.onload = loadFilaments;
</script>

</body>
</html>
