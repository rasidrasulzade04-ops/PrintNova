<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printnova Internal Calculator</title>
    <style>
        :root {
            --primary: #ff4757;
            --bg: #f1f2f6;
            --card: #ffffff;
            --text: #2f3542;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .calculator-card {
            background: var(--card);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ced6e0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .info-tag {
            font-size: 12px;
            color: #747d8c;
            margin-top: 5px;
            display: block;
        }
        .slot-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }
        .slot-btn {
            background: #dfe4ea;
            border: none;
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #57606f;
            text-align: center;
        }
        .slot-btn.active {
            background: var(--primary);
            color: white;
        }
        .slot-btn.main-slot {
            border: 2px dashed #ff4757;
        }
        .slot-btn.main-slot.active {
            border: 2px solid #2f3542;
        }
        hr {
            border: none;
            border-top: 2px dashed #ced6e0;
            margin: 25px 0;
        }
        .result-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .result-box {
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cost-box {
            background-color: #dfe4ea;
            border-left: 5px solid #747d8c;
        }
        .price-box {
            background-color: #ffeaa7;
            border-left: 5px solid #e67e22;
        }
        .result-title {
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        .result-value {
            font-size: 22px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Printnova HQ Calculator</h2>
    
    <!-- Переключатель слотов пластика (1 важный, 3 опциональных) -->
    <div class="form-group">
        <label>Выбор слота пластика:</label>
        <div class="slot-selector">
            <button type="button" class="slot-btn main-slot active" onclick="switchSlot(0)">1 (Основной)</button>
            <button type="button" class="slot-btn" onclick="switchSlot(1)">2 (Опц)</button>
            <button type="button" class="slot-btn" onclick="switchSlot(2)">3 (Опц)</button>
            <button type="button" class="slot-btn" onclick="switchSlot(3)">4 (Опц)</button>
        </div>

        <label for="filamentSelect" id="currentSlotLabel">Пластик для слота 1 (Основной):</label>
        <select id="filamentSelect" onchange="updateCurrentSlotData()">
        </select>
        <span class="info-tag" id="filamentPriceTag">Цена из БД: 0 манат/кг</span>
    </div>

    <div class="form-group">
        <label for="weightInput" id="currentWeightLabel">Вес детали для слота 1 (г):</label>
        <input type="number" id="weightInput" placeholder="Введите вес в граммах" min="0" oninput="updateCurrentSlotData()">
    </div>

    <div class="form-group">
        <label for="marginSelect">Наценка для продажи (Margin):</label>
        <select id="marginSelect" onchange="calculatePrices()">
            <option value="2">x2 (Обычная цена)</option>
            <option value="2.5">x2.5 (Рекомендуемая ярмарка)</option>
            <option value="3">x3 (Эксклюзив / Сложная печать)</option>
        </select>
    </div>

    <hr>

    <div class="result-section">
        <div class="result-box cost-box">
            <div>
                <div class="result-title">Себестоимость</div>
                <span class="info-tag">(Пластик + Амортизация + Свет)</span>
            </div>
            <div class="result-value" id="costDisplay">0.00 ₼</div>
        </div>

        <div class="result-box price-box">
            <div>
                <div class="result-title">Цена продажи</div>
                <span class="info-tag">(Рекомендуемая для клиента)</span>
            </div>
            <div class="result-value" id="priceDisplay">0.00 ₼</div>
        </div>
    </div>
</div>

<script>
// База данных пластиков
const filamentDatabase = {
    "Anycubic PLA Silk Tri-Color (Blue-Purple-Green)": 39.09,
    "Anycubic PLA Black": 30.59,
    "PLA White": 20.00
};

// Массив для хранения данных по 4 слотам (1 основной, 3 опциональных)
let slotsData = [
    { filament: "", weight: 0 },
    { filament: "", weight: 0 },
    { filament: "", weight: 0 },
    { filament: "", weight: 0 }
];

let activeSlot = 0; // Активный слот по умолчанию (0 - это первый, основной)

// Загрузка списка в выпадающий список
function loadFilaments() {
    const select = document.getElementById("filamentSelect");
    select.innerHTML = ""; 
    
    for (const color in filamentDatabase) {
        let option = document.createElement("option");
        option.value = color;
        option.textContent = color;
        select.appendChild(option);
    }
    
    // Инициализируем первый слот значениями по умолчанию
    if (select.options.length > 0) {
        slotsData[0].filament = select.options[0].value;
    }
    updateUIFromSlot();
    calculatePrices();
}

// Переключение между 4 слотами
function switchSlot(index) {
    activeSlot = index;
    
    // Подсветка активной кнопки
    const buttons = document.querySelectorAll(".slot-btn");
    buttons.forEach((btn, idx) => {
        if (idx === index) {
            btn.classList.add("active");
        } else {
            btn.classList.remove("active");
        }
    });

    // Меняем тексты подсказок в зависимости от слота
    const slotNames = ["1 (Основной)", "2 (Опциональный)", "3 (Опциональный)", "4 (Опциональный)"];
    document.getElementById("currentSlotLabel").textContent = `Пластик для слота ${slotNames[index]}:`;
    document.getElementById("currentWeightLabel").textContent = `Вес детали для слота ${slotNames[index]} (г):`;

    updateUIFromSlot();
}

// Обновление интерфейса при переключении слота (подтягиваем сохраненные данные слота в инпуты)
function updateUIFromSlot() {
    const select = document.getElementById("filamentSelect");
    const weightInput = document.getElementById("weightInput");

    select.value = slotsData[activeSlot].filament || select.options[0].value;
    weightInput.value = slotsData[activeSlot].weight === 0 ? "" : slotsData[activeSlot].weight;

    const selectedColor = select.value;
    const pricePerKg = filamentDatabase[selectedColor] || 0;
    document.getElementById("filamentPriceTag").textContent = `Цена из БД: ${pricePerKg.toFixed(2)} манат/кг`;
}

// Сохранение данных из полей в текущий активный слот и пересчет
function updateCurrentSlotData() {
    const select = document.getElementById("filamentSelect");
    const weightInput = document.getElementById("weightInput");

    slotsData[activeSlot].filament = select.value;
    slotsData[activeSlot].weight = parseFloat(weightInput.value) || 0;

    const pricePerKg = filamentDatabase[select.value] || 0;
    document.getElementById("filamentPriceTag").textContent = `Цена из БД: ${pricePerKg.toFixed(2)} манат/кг`;

    calculatePrices();
}

// Главная функция подсчета (суммирует расходы по всем 4 слотам)
function calculatePrices() {
    const multiplier = parseFloat(document.getElementById("marginSelect").value);
    
    let totalCost = 0;
    let hasWeight = false;

    // Проходимся по всем 4 слотам и суммируем их стоимость
    slotsData.forEach(slot => {
        if (slot.weight > 0) {
            hasWeight = true;
            const pricePerKg = filamentDatabase[slot.filament] || 0;
            let pricePerGram = pricePerKg / 1000;
            let plasticCost = slot.weight * pricePerGram;
            let amortization = slot.weight * 0.01; 
            let extraCosts = plasticCost * 0.10; 
            
            totalCost += (plasticCost + amortization + extraCosts);
        }
    });

    if (!hasWeight) {
        document.getElementById("costDisplay").textContent = "0.00 ₼";
        document.getElementById("priceDisplay").textContent = "0.00 ₼";
        return;
    }

    let sellingPrice = totalCost * multiplier;

    // Отображаем результаты
    document.getElementById("costDisplay").textContent = totalCost.toFixed(2) + " ₼";
    document.getElementById("priceDisplay").textContent = Math.ceil(sellingPrice) + ".00 ₼"; 
}

window.onload = loadFilaments;
</script>

</body>
</html>
