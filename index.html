<script>
        // НАСТРОЙКИ SUPABASE (Прямые запросы через fetch API)
        const SUPABASE_URL = 'https://pqppqgrdspqflvajdqry.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C8jLdGI2GyfnztiPDhITNQ_EOnYzN4B';

        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
        };

        // ДАННЫЕ КАТАЛОГА ТОВАРОВ
        const products = [
            { id: 1, name: "Подставка для наушников Cyber", price: 25.00, desc: "Стильный дизайн в стиле киберпанк" },
            { id: 2, name: "Шарнирный дракон (Flexi)", price: 35.00, desc: "Подвижная многоцветная игрушка" },
            { id: 3, name: "Органайзер для кабелей Nova", price: 15.00, desc: "Порядок на рабочем столе" },
            { id: 4, name: "Фигурка Iron Spider", price: 40.00, desc: "Коллекционная фигурка высокого качества" }
        ];

        let cart = [];

        // Отрисовка каталога на сайте
        function renderCatalog() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-img">3D Model Preview</div>
                    <div class="product-content">
                        <div class="product-name">${p.name}</div>
                        <div class="product-price">${p.price.toFixed(2)} ₼</div>
                        <div class="product-buttons">
                            <button class="btn-card-secondary" onclick="addToCart(${p.id})">В корзину</button>
                            <button class="btn-card-primary" onclick="quickBuy(${p.id})">Купить</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Логика корзины
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
            toggleCart();
        }

        function quickBuy(productId) {
            addToCart(productId);
        }

        function updateCartUI() {
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
            const container = document.getElementById('cartItemsContainer');
            
            if (cart.length === 0) {
                container.innerHTML = `<p style="color: var(--text-dim); text-align: center; margin-top: 40px;">Корзина пуста</p>`;
                document.getElementById('cartTotalPrice').textContent = "0.00 ₼";
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: 600;">${item.name}</div>
                            <div style="font-size: 12px; color: var(--text-dim);">${item.qty} шт. × ${item.price} ₼</div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:#ff4757; cursor:pointer;">Удалить</button>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotalPrice').textContent = total.toFixed(2) + " ₼";
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        async function checkoutOrder() {
            const name = document.getElementById('orderName').value;
            const phone = document.getElementById('orderPhone').value;
            if (!name || !phone || cart.length === 0) {
                alert('Заполните имя, телефон и добавьте товары в корзину!');
                return;
            }

            const orderDetails = cart.map(i => `${i.name} (${i.qty} шт.)`).join(', ');
            const totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        client_name: name,
                        phone: phone,
                        material: `Заказ товаров: ${orderDetails} | Сумма: ${totalSum} ₼`
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText);
                }

                alert('Заказ успешно оформлен!');
                cart = [];
                updateCartUI();
                toggleCart();
            } catch (err) {
                alert('Ошибка отправки в базу: ' + err.message);
            }
        }

        // Секретный вход для работников (пароль: anycubic)
        function openWorkerPanel() {
            const code = prompt("Введите пин-код сотрудника:");
            if (code === "anycubic") {
                document.getElementById('publicSite').style.display = 'none';
                document.getElementById('workerPanel').style.display = 'block';
                loadWorkerOrders();
                initCalculator();
            } else if (code !== null) {
                alert('Неверный код!');
            }
        }

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            btn.classList.add('active');
        }

        async function loadWorkerOrders() {
            const container = document.getElementById('ordersList');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=id.desc`, {
                    method: 'GET',
                    headers: headers
                });

                if (!response.ok) throw new Error(await response.text());
                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = '<p>Пока нет входящих заказов.</p>';
                    return;
                }
                container.innerHTML = data.map(o => `
                    <div id="order-${o.id}" style="background: #121212; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #282828; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>Клиент:</strong> ${o.client_name} | <strong>Телефон:</strong> ${o.phone}<br>
                            <strong>Детали:</strong> ${o.material}
                        </div>
                        <button onclick="completeOrder(${o.id})" style="background: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;">Завершить</button>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="color: #ff4757;">Ошибка загрузки заказов: ' + err.message + '</p>';
            }
        }
