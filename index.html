<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printnova | 3D Печать на заказ</title>
    
    <!-- Иконка сайта -->
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #2563eb; --bg: #ffffff; --card-bg: #f4f4f4; --text: #111111; --text-dim: #666666; --border-color: #e0e0e0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: var(--accent); margin: 0; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 20px; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: #ffffff; border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; color: var(--text); font-family: inherit; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; width: 100%; font-size: 16px; }
        .btn:hover { opacity: 0.9; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .product-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Printnova</h1>
            <a href="admin.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">Админ-панель</a>
        </header>

        <!-- Секция заказа по ссылке MakerWorld -->
        <div class="card">
            <h2 style="margin-top: 0; margin-bottom: 10px;">Заказать модель по ссылке MakerWorld</h2>
            <p style="color: var(--text-dim); font-size: 14px; margin-top: 0; margin-bottom: 20px;">Вставьте ссылку на модель с MakerWorld, выберите пластик и укажите вес в граммах (указан на сайте модели), чтобы сразу узнать цену и оформить заказ.</p>
            
            <div class="form-group">
                <label>Ссылка на модель MakerWorld:</label>
                <input type="text" id="orderLink" placeholder="https://makerworld.com/en/models/...">
            </div>
            
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div class="form-group" style="flex: 2; min-width: 200px;">
                    <label>Материал / Пластик:</label>
                    <select id="orderMaterial" onchange="calculateOrderPrice()">
                        <option value="35">PLA Standard (35 ₼/кг)</option>
                        <option value="40">PETG Pro (40 ₼/кг)</option>
                        <option value="45">ABS Tough (45 ₼/кг)</option>
                        <option value="55">TPU Flexible (55 ₼/кг)</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1; min-width: 140px;">
                    <label>Вес модели (г):</label>
                    <input type="number" id="orderWeight" placeholder="Например: 45" min="1" oninput="calculateOrderPrice()">
                </div>
            </div>

            <div style="background: #ffffff; border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 13px; color: var(--text-dim);">РАСЧЕТНАЯ СТОИМОСТЬ:</div>
                    <div id="calculatedPriceDisplay" style="font-size: 24px; font-weight: 800; color: var(--accent);">0 ₼</div>
                </div>
            </div>

            <div class="form-group">
                <label>Ваше имя:</label>
                <input type="text" id="clientName" placeholder="Введите ваше имя">
            </div>
            <div class="form-group">
                <label>Телефон / Контакт:</label>
                <input type="text" id="clientPhone" placeholder="+994 (...) ...-..-..">
            </div>
            <button class="btn" onclick="submitMakerWorldOrder()">Отправить заказ</button>
        </div>

        <!-- Каталог готовых товаров -->
        <h2>Каталог товаров</h2>
        <div id="catalogProducts" class="products-grid">Загрузка товаров...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pqppqgrdspqflvajdqry.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C8jLdGI2GyfnztiPDhITNQ_EOnYzN4B';
        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
        };

        function calculateOrderPrice() {
            const weight = parseFloat(document.getElementById('orderWeight').value) || 0;
            const pricePerKg = parseFloat(document.getElementById('orderMaterial').value) || 35;
            
            // Расчет себестоимости по весу + наценка x2
            let baseCost = (weight / 1000) * pricePerKg; 
            let finalPrice = Math.max(Math.round(baseCost * 2), 5);
            if (weight === 0) finalPrice = 0;
            
            document.getElementById('calculatedPriceDisplay').textContent = finalPrice + ' ₼';
        }

        async function submitMakerWorldOrder() {
            const link = document.getElementById('orderLink').value.trim();
            const weight = document.getElementById('orderWeight').value.trim();
            const materialSelect = document.getElementById('orderMaterial');
            const materialName = materialSelect.options[materialSelect.selectedIndex].text;
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();
            const priceText = document.getElementById('calculatedPriceDisplay').textContent;

            if (!link) return alert('Пожалуйста, введите ссылку на MakerWorld!');
            if (!weight || parseFloat(weight) <= 0) return alert('Укажите вес модели в граммах!');
            if (!name || !phone) return alert('Пожалуйста, укажите ваше имя и телефон!');

            const orderPayload = {
                client_name: name,
                phone: phone,
                material: `${materialName} | Вес: ${weight}г | Итог: ${priceText}`,
                image_url: '',
                makerworld_link: link
            };

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: 'POST',
                    headers: { ...headers, 'Prefer': 'return=minimal' },
                    body: JSON.stringify(orderPayload)
                });

                if (!res.ok) throw new Error(await res.text());

                alert('Ваш заказ успешно отправлен! Мы свяжемся с вами.');
                document.getElementById('orderLink').value = '';
                document.getElementById('orderWeight').value = '';
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';
                calculateOrderPrice();
            } catch (err) {
                alert('Ошибка при отправке заказа: ' + err.message);
            }
        }

        async function loadCatalog() {
            const container = document.getElementById('catalogProducts');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, { headers: headers });
                const products = await res.json();
                if (!products || products.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-dim);">Товары пока не добавлены.</p>';
                    return;
                }
                container.innerHTML = products.map(p => `
                    <div class="product-card">
                        <div>
                            ${p.image_url ? `<img src="${p.image_url}" alt="${p.name_ru || p.name}">` : ''}
                            <h3 style="margin: 0 0 8px 0; font-size: 16px;">${p.name_ru || p.name}</h3>
                            <p style="color: var(--text-dim); font-size: 13px; margin: 0 0 12px 0;">${p.desc_ru || ''}</p>
                        </div>
                        <div>
                            <div style="font-weight: 800; color: var(--accent); font-size: 18px; margin-bottom: 10px;">${p.price} ₼</div>
                            ${p.makerworld_link ? `<a href="${p.makerworld_link}" target="_blank" style="display: block; text-align: center; background: #f0f0f0; color: var(--text); padding: 8px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 13px; margin-bottom: 8px;">Ссылка на MakerWorld</a>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="color: red;">Ошибка загрузки каталога товаров.</p>';
            }
        }

        loadCatalog();
    </script>
</body>
</html>
