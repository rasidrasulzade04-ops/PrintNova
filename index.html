<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintNova | 3D Печать</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --accent: #ff6b00;
            --accent-hover: #ff8522;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Главная область */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .worker-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .worker-btn:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }

        /* Сетка товаров */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #383838;
        }

        .model-preview {
            height: 140px;
            background: #101010;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px dashed var(--border);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .btn-add {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: var(--accent-hover);
        }

        /* Корзина (Sidebar) */
        .cart-sidebar {
            width: 360px;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cart-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info span {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 13px;
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .checkout-form input {
            width: 100%;
            padding: 10px 14px;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .checkout-form input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn-checkout {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background-color: #218838;
        }

        /* Модальное окно панели работника */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 600px;
            max-height: 80vh;
            border-radius: 14px;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 22px;
            cursor: pointer;
        }

        .orders-list {
            flex: 1;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- Главная часть с каталогом -->
    <div class="main-content">
        <header>
            <div class="logo">PRINT<span>NOVA</span></div>
            <button class="worker-btn" onclick="openWorkerPanel()">Панель работника</button>
        </header>

        <div class="catalog">
            <div class="card">
                <div class="model-preview">3D Model Preview</div>
                <div class="card-title">Подставка для наушников Cyber</div>
                <div class="card-price">25.00 ₼</div>
                <button class="btn-add" onclick="addToCart('Подставка для наушников Cyber', 25)">В корзину</button>
            </div>

            <div class="card">
                <div class="model-preview">3D Model Preview</div>
                <div class="card-title">Шарнирный дракон (Flexi)</div>
                <div class="card-price">35.00 ₼</div>
                <button class="btn-add" onclick="addToCart('Шарнирный дракон (Flexi)', 35)">В корзину</button>
            </div>

            <div class="card">
                <div class="model-preview">3D Model Preview</div>
                <div class="card-title">Органайзер для кабелей Nova</div>
                <div class="card-price">15.00 ₼</div>
                <button class="btn-add" onclick="addToCart('Органайзер для кабелей Nova', 15)">В корзину</button>
            </div>
        </div>
    </div>

    <!-- Боковая панель корзины -->
    <div class="cart-sidebar">
        <div>
            <div class="cart-title">Ваша корзина</div>
            <div class="cart-items" id="cartItems">
                <p style="color: var(--text-dim); font-size: 14px;">Корзина пуста</p>
            </div>
        </div>

        <div class="cart-footer">
            <div class="total-row">
                <span>Итого:</span>
                <span id="cartTotal">0.00 ₼</span>
            </div>
            <div class="checkout-form">
                <input type="text" id="clientName" placeholder="Ваше имя">
                <input type="text" id="clientPhone" placeholder="Номер телефона">
                <button class="btn-checkout" onclick="checkout()">Оформить заказ</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно панели работника -->
    <div class="modal" id="workerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Входящие заказы</h2>
                <button class="close-modal" onclick="closeWorkerPanel()">&times;</button>
            </div>
            <div class="orders-list" id="ordersList">
                <p>Загрузка заказов...</p>
            </div>
        </div>
    </div>

    <script>
        // НАСТРОЙКИ SUPABASE (Уже прописаны)
        const SUPABASE_URL = 'https://pqppqgrdspqflvajdqry.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C8jLdGI2GyfnztiPDhITNQ_EOnYzN4B';

        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
        };

        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length === 0) {
                container.innerHTML = '<p style="color: var(--text-dim); font-size: 14px;">Корзина пуста</p>';
                totalEl.innerText = '0.00 ₼';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <strong>${item.name}</strong>
                            <span>${item.price} ₼</span>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${index})">Удалить</button>
                    </div>
                `;
            }).join('');

            totalEl.innerText = total.toFixed(2) + ' ₼';
        }

        async function checkout() {
            const name = document.getElementById('clientName').value.trim();
            const phone = document.getElementById('clientPhone').value.trim();

            if (!name || !phone) {
                alert('Пожалуйста, заполните имя и телефон!');
                return;
            }

            if (cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }

            const materialSummary = cart.map(i => `${i.name} (${i.price} ₼)`).join(', ');

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        client_name: name,
                        phone: phone,
                        material: materialSummary
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText);
                }

                alert('Заказ успешно отправлен!');
                cart = [];
                updateCartUI();
                document.getElementById('clientName').value = '';
                document.getElementById('clientPhone').value = '';

            } catch (err) {
                alert('Ошибка отправки в базу:\n' + err.message);
            }
        }

        // Управление панелью работника
        function openWorkerPanel() {
            document.getElementById('workerModal').style.display = 'flex';
            loadWorkerOrders();
        }

        function closeWorkerPanel() {
            document.getElementById('workerModal').style.display = 'none';
        }

        async function loadWorkerOrders() {
            const container = document.getElementById('ordersList');
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=id.desc`, {
                    method: 'GET',
                    headers: headers
                });

                if (!response.ok) throw new Error(await response.text());
                const data = await response.json();

                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-dim);">Пока нет входящих заказов.</p>';
                    return;
                }
                
                container.innerHTML = data.map(o => `
                    <div id="order-${o.id}" style="background: #121212; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #282828; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <strong>Клиент:</strong> ${o.client_name} | <strong>Телефон:</strong> ${o.phone}<br>
                            <span style="color: var(--text-dim); font-size: 14px;">${o.material}</span>
                        </div>
                        <button onclick="completeOrder(${o.id})" style="background: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;">Завершить</button>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<p style="color: #ff4757;">Ошибка загрузки заказов: ' + err.message + '</p>';
            }
        }

        async function completeOrder(orderId) {
            if (!confirm("Заказ выполнен? Он будет удален из списка.")) return;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${orderId}`, {
                    method: 'DELETE',
                    headers: headers
                });

                if (!response.ok) throw new Error(await response.text());

                // Убираем блок из интерфейса без перезагрузки
                const element = document.getElementById(`order-${orderId}`);
                if (element) element.remove();

                // Если список стал пустым, показываем надпись
                const container = document.getElementById('ordersList');
                if (!container.children.length) {
                    container.innerHTML = '<p style="color: var(--text-dim);">Пока нет входящих заказов.</p>';
                }
            } catch (err) {
                alert('Ошибка при удалении заказа: ' + err.message);
            }
        }
    </script>
</body>
</html>
