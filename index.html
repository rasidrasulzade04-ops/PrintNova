<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Printnova | Modern 3D Printing Baku</title>
    
    <!-- Иконка сайта (фавикон) в самом верху вкладки -->
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root { --accent: #2563eb; --bg: #ffffff; --card-bg: #f4f4f4; --text: #111111; --text-dim: #666666; --border-color: #e0e0e0; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border-color); }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        
        .lang-switcher { display: flex; gap: 5px; background: #eee; padding: 3px; border-radius: 8px; }
        .lang-btn { background: transparent; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px; color: var(--text); }
        .lang-btn.active { background: var(--accent); color: white; }

        .logo-container { display: flex; align-items: center; text-decoration: none; cursor: pointer; }
        .logo-text { font-weight: 800; font-size: 24px; color: var(--text); }
        .logo-text span { color: var(--accent); }
        
        .nav-right { display: flex; gap: 15px; align-items: center; }
        .cart-btn { background: #111; border: 1px solid #111; color: white; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; }
        .cart-btn:hover { background: var(--accent); border-color: var(--accent); }

        .user-profile-box { display: none; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
        .logout-btn { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 600; }

        header { height: 45vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        header h1 { font-size: clamp(40px, 8vw, 80px); margin: 0; line-height: 1; color: var(--text); }
        header p { color: var(--text-dim); margin-top: 15px; font-size: 18px; }

        .public-calc-section { padding: 0 10% 40px 10%; max-width: 1400px; margin: 0 auto; }
        .calc-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        .catalog-container { padding: 20px 10% 60px 10%; max-width: 1400px; margin: 0 auto; }
        .catalog-title { font-size: 28px; font-weight: 800; margin-bottom: 30px; border-left: 4px solid var(--accent); padding-left: 15px; color: var(--text); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); border-color: #ccc; }
        .product-img { height: 200px; background: #e8e8e8; object-fit: cover; width: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; }
        .product-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-size: 18px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
        .product-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 15px; flex-grow: 1; }
        .product-price { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
        .product-buttons { display: flex; gap: 10px; margin-top: auto; }
        .btn-card-secondary { background: #ffffff; color: var(--text); border: 1px solid var(--border-color); padding: 10px; border-radius: 12px; flex: 1; cursor: pointer; font-weight: 600; }
        .btn-card-primary { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 12px; flex: 1; cursor: pointer; font-weight: 600; }

        .cart-sidebar { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: #ffffff; border-left: 1px solid var(--border-color); box-shadow: -10px 0 30px rgba(0,0,0,0.1); z-index: 2000; transition: right 0.3s ease; display: flex; flex-direction: column; padding: 30px; }
        .cart-sidebar.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 20px; font-weight: 800; color: var(--text); }
        .close-cart { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .cart-total { font-size: 18px; font-weight: 800; margin-bottom: 20px; display: flex; justify-content: space-between; color: var(--text); }
        .cart-form input { width: 100%; background: #ffffff; border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; color: var(--text); margin-bottom: 12px; }
        .btn-checkout { background: var(--accent); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .calc-group { margin-bottom: 15px; }
        .calc-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text); }
        .calc-group input { width: 100%; background: #ffffff; border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; color: var(--text); }
    </style>
</head>
<body>

    <div id="publicSite">
        <nav>
            <div class="nav-left">
                <div class="lang-switcher">
                    <button id="btnRu" class="lang-btn active" onclick="setLanguage('ru')">RU</button>
                    <button id="btnEn" class="lang-btn" onclick="setLanguage('en')">EN</button>
                </div>
                <!-- Логотип картинкой здесь больше не выводится, только название -->
                <a href="#" class="logo-container">
                    <div class="logo-text">PRINT<span>NOVA</span></div>
                </a>
            </div>

            <div class="nav-right">
                <div id="googleAuthContainer">
                    <div id="g_id_onload"
                         data-client_id="932375852807-nbjh9hnur87f05ni4fhqulhqmct53ja7.apps.googleusercontent.com"
                         data-callback="handleGoogleLogin"
                         data-auto_prompt="false">
                    </div>
                    <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="outline" data-text="sign_in_with" data-shape="pill" data-logo_alignment="left"></div>
                </div>

                <div id="userProfileBox" class="user-profile-box">
                    <span id="welcomeUserText">Привет, Гость</span>
                    <button class="logout-btn" onclick="handleLogout()">Log Out</button>
                </div>

                <button class="cart-btn" onclick="toggleCart()"><span data-i18n="cart">Корзина</span> (<span id="cartCount">0</span>)</button>
            </div>
        </nav>

        <header>
            <h1 data-i18n="heroTitle">PRINT THE <br><span style="color: var(--accent);">FUTURE.</span></h1>
            <p data-i18n="heroSubtitle">Современная 3D-печать и готовые дизайнерские модели в Баку</p>
        </header>

        <div class="public-calc-section">
            <div class="calc-card">
                <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 20px; border-left: 3px solid var(--accent); padding-left: 10px; color: var(--text);" data-i18n="calcTitle">Калькулятор стоимости печати</h3>
                <div class="calc-group">
                    <label data-i18n="plasticLabel">Пластик:</label>
                    <input type="text" value="Стандартный PLA (35.00 ₼/кг)" disabled style="color: var(--text-dim); background: #eaeaea;" id="plasticInputDesc">
                </div>
                <div class="calc-group">
                    <label data-i18n="weightLabel">Вес детали (г):</label>
                    <input type="number" id="publicWeightInput" placeholder="Введите вес в граммах" min="0" oninput="calculatePublicCalc()">
                </div>
                <div style="background: #ffffff; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-top: 20px; text-align: center;">
                    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 5px;" data-i18n="estPrice">РАСЧЕТНАЯ ЦЕНА</div>
                    <div style="font-size: 26px; font-weight: 800; color: var(--accent);" id="publicPriceDisplay">0.00 ₼</div>
                </div>
            </div>
        </div>

        <div class="catalog-container">
            <div class="catalog-title" data-i18n="catalogTitle">Каталог моделей</div>
            <div class="products-grid" id="productsGrid"></div>
        </div>
    </div>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <span data-i18n="cartTitle">Ваша корзина</span>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <p style="color: var(--text-dim); text-align: center; margin-top: 40px;" data-i18n="cartEmpty">Корзина пуста</p>
        </div>
        <div class="cart-total">
            <span data-i18n="total">Итого:</span>
            <span id="cartTotalPrice">0.00 ₼</span>
        </div>
        <div class="cart-form">
            <input type="text" id="orderName" placeholder="Ваше имя" data-i18n-placeholder="namePlaceholder">
            <input type="tel" id="orderPhone" placeholder="Телефон" data-i18n-placeholder="phonePlaceholder">
            <div id="orderPhotoFieldContainer" style="display: none; margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px;" data-i18n="orderPhotoLabel">Фото модели / чертежа:</label>
                <input type="file" id="orderImageFile" accept="image/*" style="padding: 6px; font-size: 12px; width: 100%; background: #fff; border: 1px solid var(--border-color); border-radius: 10px;">
            </div>
            <button class="btn-checkout" onclick="checkoutOrder()" data-i18n="checkoutBtn">Оформить заказ</button>
        </div>
    </div>

    <script>
        const translations = {
            ru: {
                cart: "Корзина",
                heroTitle: "PRINT THE <br><span style='color: var(--accent);'>FUTURE.</span>",
                heroSubtitle: "Современная 3D-печать и готовые дизайнерские модели в Баку",
                calcTitle: "Калькулятор стоимости печати",
                plasticLabel: "Пластик:",
                plasticDesc: "Стандартный PLA (35.00 ₼/кг)",
                weightLabel: "Вес детали (г):",
                weightPlaceholder: "Введите вес в граммах",
                estPrice: "РАСЧЕТНАЯ ЦЕНА",
                catalogTitle: "Каталог моделей",
                cartTitle: "Ваша корзина",
                cartEmpty: "Корзина пуста",
                total: "Итого:",
                namePlaceholder: "Ваше имя",
                phonePlaceholder: "Телефон",
                orderPhotoLabel: "Фото модели / чертежа:",
                checkoutBtn: "Оформить заказ",
                hello: "Привет, "
            },
            en: {
                cart: "Cart",
                heroTitle: "PRINT THE <br><span style='color: var(--accent);'>FUTURE.</span>",
                heroSubtitle: "Modern 3D printing and ready design models in Baku",
                calcTitle: "Print Cost Calculator",
                plasticLabel: "Filament:",
                plasticDesc: "Standard PLA (35.00 ₼/kg)",
                weightLabel: "Part weight (g):",
                weightPlaceholder: "Enter weight in grams",
                estPrice: "ESTIMATED PRICE",
                catalogTitle: "Model Catalog",
                cartTitle: "Your Cart",
                cartEmpty: "Cart is empty",
                total: "Total:",
                namePlaceholder: "Your Name",
                phonePlaceholder: "Phone",
                orderPhotoLabel: "Model / drawing photo:",
                checkoutBtn: "Checkout Order",
                hello: "Hello, "
            }
        };

        let currentLang = localStorage.getItem('printnova_lang') || 'ru';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('printnova_lang', lang);
            document.getElementById('btnRu').classList.toggle('active', lang === 'ru');
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerHTML = translations[lang][key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });

            document.getElementById('plasticInputDesc').value = translations[lang].plasticDesc;
            document.getElementById('publicWeightInput').placeholder = translations[lang].weightPlaceholder;

            const savedUser = localStorage.getItem('printnova_user');
            if (savedUser) document.getElementById('welcomeUserText').textContent = translations[currentLang].hello + savedUser;
            if (products.length > 0) renderCatalog();
        }

        const SUPABASE_URL = 'https://pqppqgrdspqflvajdqry.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C8jLdGI2GyfnztiPDhITNQ_EOnYzN4B';
        const headers = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_KEY
        };

        let products = [];
        let cart = [];

        function handleGoogleLogin(response) {
            try {
                const base64Url = response.credential.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
                const userData = JSON.parse(jsonPayload);
                localStorage.setItem('printnova_user', userData.name);
                updateUserUI(userData.name);
            } catch (e) { console.error(e); }
        }

        function updateUserUI(userName) {
            const authContainer = document.getElementById('googleAuthContainer');
            const profileBox = document.getElementById('userProfileBox');
            const welcomeText = document.getElementById('welcomeUserText');
            if (userName) {
                authContainer.style.display = 'none';
                profileBox.style.display = 'flex';
                welcomeText.textContent = translations[currentLang].hello + userName;
            } else {
                authContainer.style.display = 'block';
                profileBox.style.display = 'none';
            }
        }

        function handleLogout() {
            localStorage.removeItem('printnova_user');
            updateUserUI(null);
            location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage(currentLang);
            loadCatalog();
            const savedUser = localStorage.getItem('printnova_user');
            if (savedUser) updateUserUI(savedUser);
        });

        function checkCartPhotoRequirement() {
            const allowPhoto = cart.some(item => item.allow_photo === true);
            const container = document.getElementById('orderPhotoFieldContainer');
            if (container) container.style.display = allowPhoto ? 'block' : 'none';
        }

        async function loadCatalog() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, { method: 'GET', headers: headers });
                if (!response.ok) throw new Error(await response.text());
                products = await response.json();
                renderCatalog();
            } catch (err) { console.error(err); }
        }

        function renderCatalog() {
            const grid = document.getElementById('productsGrid');
            if (!products || products.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-dim);">Товары скоро появятся.</p>';
                return;
            }
            const buyText = currentLang === 'en' ? 'Buy' : 'Купить';
            const cartText = currentLang === 'en' ? 'Add to cart' : 'В корзину';

            grid.innerHTML = products.map(p => {
                const name = (currentLang === 'en' && p.name_en) ? p.name_en : (p.name_ru || p.name || '');
                const desc = (currentLang === 'en' && p.desc_en) ? p.desc_en : (p.desc_ru || p.desc || '');
                return `
                    <div class="product-card">
                        ${p.image_url ? `<img src="${p.image_url}" class="product-img" alt="${name}">` : `<div class="product-img">3D Model Preview</div>`}
                        <div class="product-content">
                            <div class="product-name">${name}</div>
                            <div class="product-desc">${desc}</div>
                            <div class="product-price">${Number(p.price).toFixed(2)} ₼</div>
                            <div class="product-buttons">
                                <button class="btn-card-secondary" onclick="addToCart(${p.id})">${cartText}</button>
                                <button class="btn-card-primary" onclick="quickBuy(${p.id})">${buyText}</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('open'); }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);
            if (existing) existing.qty++;
            else cart.push({ ...product, qty: 1 });
            updateCartUI();
            toggleCart();
        }

        function quickBuy(productId) { addToCart(productId); }

        function updateCartUI() {
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.qty, 0);
            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = `<p style="color: var(--text-dim); text-align: center; margin-top: 40px;">${translations[currentLang].cartEmpty}</p>`;
                document.getElementById('cartTotalPrice').textContent = "0.00 ₼";
                checkCartPhotoRequirement();
                return;
            }
            const delText = currentLang === 'en' ? 'Delete' : 'Удалить';
            let total = 0;
            container.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                const itemName = (currentLang === 'en' && item.name_en) ? item.name_en : (item.name_ru || item.name || '');
                return `
                    <div class="cart-item">
                        <div>
                            <div style="font-weight: 600; color: var(--text);">${itemName}</div>
                            <div style="font-size: 12px; color: var(--text-dim);">${item.qty} шт. × ${item.price} ₼</div>
                        </div>
                        <button onclick="removeFromCart(${item.id})" style="background:none; border:none; color:#ff4757; cursor:pointer;">${delText}</button>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotalPrice').textContent = total.toFixed(2) + " ₼";
            checkCartPhotoRequirement();
        }

        function removeFromCart(id) { cart = cart.filter(item => item.id !== id); updateCartUI(); }

        async function checkoutOrder() {
            const name = document.getElementById('orderName').value.trim();
            const phoneInput = document.getElementById('orderPhone').value.trim();
            if (!name || cart.length === 0) {
                alert(currentLang === 'en' ? 'Fill in your name and add items!' : 'Заполните имя и добавьте товары!');
                return;
            }
            let cleanPhone = phoneInput.replace(/[\s\-\(\)]/g, '');
            const azPhoneRegex = /^(\+994|994|0)?(50|51|55|10|70|77|99)\d{7}$/;
            if (!azPhoneRegex.test(cleanPhone)) {
                alert('Введите корректный азербайджанский номер!');
                return;
            }
            const orderDetails = cart.map(i => `${i.name_ru || i.name} (${i.qty} шт.)`).join(', ');
            const totalSum = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const allowPhoto = cart.some(item => item.allow_photo === true);
            const fileInput = document.getElementById('orderImageFile');
            let orderImageUrl = '';
            if (allowPhoto && fileInput && fileInput.files[0]) {
                orderImageUrl = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(fileInput.files[0]);
                });
            }
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        client_name: name,
                        phone: phoneInput,
                        material: `Заказ товаров: ${orderDetails} | Сумма: ${totalSum} ₼`,
                        image_url: orderImageUrl
                    })
                });
                if (!response.ok) throw new Error(await response.text());
                alert('Заказ успешно оформлен!');
                cart = [];
                updateCartUI();
                toggleCart();
                document.getElementById('orderName').value = '';
                document.getElementById('orderPhone').value = '';
            } catch (err) { alert('Ошибка: ' + err.message); }
        }

        function calculatePublicCalc() {
            const weight = parseFloat(document.getElementById('publicWeightInput').value) || 0;
            const cost = (weight / 1000) * 35;
            document.getElementById('publicPriceDisplay').textContent = (cost * 2).toFixed(2) + " ₼";
        }
    </script>
</body>
</html>
